<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1410;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1612;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0d0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c75a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e07040;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#c75a2a;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#c75a2a;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="56" y1="0" x2="56" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="112" y1="0" x2="112" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="168" y1="0" x2="168" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="224" y1="0" x2="224" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="280" y1="0" x2="280" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="336" y1="0" x2="336" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="392" y1="0" x2="392" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="448" y1="0" x2="448" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="504" y1="0" x2="504" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="616" y1="0" x2="616" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="672" y1="0" x2="672" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="728" y1="0" x2="728" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="784" y1="0" x2="784" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="896" y1="0" x2="896" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="952" y1="0" x2="952" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="1008" y1="0" x2="1008" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="1064" y1="0" x2="1064" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="1176" y1="0" x2="1176" y2="630" stroke="#c75a2a" stroke-width="1"/>
    <line x1="0" y1="56" x2="1200" y2="56" stroke="#c75a2a" stroke-width="1"/>
    <line x1="0" y1="112" x2="1200" y2="112" stroke="#c75a2a" stroke-width="1"/>
    <line x1="0" y1="168" x2="1200" y2="168" stroke="#c75a2a" stroke-width="1"/>
    <line x1="0" y1="224" x2="1200" y2="224" stroke="#c75a2a" stroke-width="1"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#c75a2a" stroke-width="1"/>
    <line x1="0" y1="336" x2="1200" y2="336" stroke="#c75a2a" stroke-width="1"/>
    <line x1="0" y1="392" x2="1200" y2="392" stroke="#c75a2a" stroke-width="1"/>
    <line x1="0" y1="448" x2="1200" y2="448" stroke="#c75a2a" stroke-width="1"/>
    <line x1="0" y1="504" x2="1200" y2="504" stroke="#c75a2a" stroke-width="1"/>
    <line x1="0" y1="560" x2="1200" y2="560" stroke="#c75a2a" stroke-width="1"/>
    <line x1="0" y1="616" x2="1200" y2="616" stroke="#c75a2a" stroke-width="1"/>
  </g>

  <!-- Ambient glow orb -->
  <circle cx="900" cy="150" r="300" fill="url(#glow)" />
  <circle cx="200" cy="500" r="250" fill="url(#glow)" opacity="0.5" />

  <!-- Logo mark -->
  <rect x="80" y="80" width="64" height="64" rx="14" fill="url(#accent)" />
  <text x="112" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle">M</text>

  <!-- Brand name -->
  <text x="160" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#f5f0eb" letter-spacing="-0.5">MirrorSite</text>
  <text x="348" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#c75a2a" letter-spacing="-0.5">.ai</text>

  <!-- Main headline -->
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#f5f0eb" letter-spacing="-1.5">
    <tspan>Automated Application</tspan>
  </text>
  <text x="80" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#f5f0eb" letter-spacing="-1.5">
    <tspan>&amp; Site Builder</tspan>
  </text>

  <!-- Description -->
  <text x="80" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a09080" letter-spacing="0.2">
    <tspan>Instant full-stack code and web generation</tspan>
  </text>
  <text x="80" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a09080" letter-spacing="0.2">
    <tspan>powered by ATAI Enterprises.</tspan>
  </text>

  <!-- Feature pills -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="180" height="38" rx="19" fill="#c75a2a" fill-opacity="0.12" stroke="#c75a2a" stroke-opacity="0.25" stroke-width="1"/>
    <text x="90" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#c75a2a" text-anchor="middle">AI-Powered</text>

    <rect x="200" y="0" width="200" height="38" rx="19" fill="#c75a2a" fill-opacity="0.12" stroke="#c75a2a" stroke-opacity="0.25" stroke-width="1"/>
    <text x="300" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#c75a2a" text-anchor="middle">Full-Stack Generation</text>

    <rect x="420" y="0" width="170" height="38" rx="19" fill="#c75a2a" fill-opacity="0.12" stroke="#c75a2a" stroke-opacity="0.25" stroke-width="1"/>
    <text x="505" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#c75a2a" text-anchor="middle">MVP Builder</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#c75a2a" fill-opacity="0.08" />
  <text x="80" y="616" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#706050" letter-spacing="0.5">mirrorsite.atai.ink</text>
  <text x="1120" y="616" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#706050" text-anchor="end" letter-spacing="0.5">by ATAI Enterprises</text>
</svg>
