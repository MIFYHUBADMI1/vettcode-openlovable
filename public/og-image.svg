<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Atai — Your business. Your AI teams.</title>
  <desc id="description">Start, run, and grow an online business of your own. Planning, building, hosting, operations, and marketing.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#151630"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#8ba4ff"/>
      <stop offset="1" stop-color="#c6a4ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#6366f1" stop-opacity=".24"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1040" cy="190" r="430" fill="url(#glow)"/>
  <g fill="none" stroke="#a5b4fc" stroke-opacity=".1">
    <circle cx="1080" cy="200" r="170"/>
    <circle cx="1080" cy="200" r="240"/>
    <circle cx="1080" cy="200" r="310"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="80" y="111" fill="#f8fafc" font-size="38" font-weight="700" letter-spacing="-1">Atai</text>
    <text x="80" y="245" fill="#f8fafc" font-size="78" font-weight="700" letter-spacing="-3">Your business.</text>
    <text x="80" y="338" fill="url(#accent)" font-size="78" font-weight="700" letter-spacing="-3">Your AI teams.</text>
    <text x="80" y="402" fill="#b9c4d8" font-size="27">Start, run, and grow an online business of your own.</text>
    <g transform="translate(80 451)" font-size="18" fill="#d8dfff" text-anchor="middle">
      <g fill="#818cf8" fill-opacity=".1" stroke="#818cf8" stroke-opacity=".3">
        <rect width="124" height="42" rx="21"/>
        <rect x="138" width="124" height="42" rx="21"/>
        <rect x="276" width="124" height="42" rx="21"/>
        <rect x="414" width="144" height="42" rx="21"/>
        <rect x="572" width="144" height="42" rx="21"/>
      </g>
      <text x="62" y="28">Planning</text>
      <text x="200" y="28">Building</text>
      <text x="338" y="28">Hosting</text>
      <text x="486" y="28">Operations</text>
      <text x="644" y="28">Marketing</text>
    </g>
    <line x1="80" y1="548" x2="1120" y2="548" stroke="#a5b4fc" stroke-opacity=".18"/>
    <text x="80" y="584" fill="#a9b5ca" font-size="18">Making business ownership more accessible.</text>
    <text x="1120" y="584" fill="#d8dfff" font-size="18" text-anchor="end">atai.ink</text>
  </g>
